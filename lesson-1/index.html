<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Introduction | COMP1073 Client-Side JavaScript</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- STEP 6: Move JS to external file and reference it with defer -->
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1>JavaScript Introduction</h1>
    
    <!-- STEP 5: Example of onclick attribute (Bad practice) -->
    <!-- <p>Hello, <em onclick="updateName()">teacher Scott</em>. ...</p> -->
    
    <p>Hello, <em>teacher Scott</em>. This week's lesson is all about the basics of adding JavaScript to HTML and CSS.</p>

    <script>
        /*
        STEP 1: What is JavaScript?
        JavaScript is an interpreted language, rather than a compiled language like C/C++. 
        It can run on servers or clients. It stores variables, manipulates strings, 
        responds to events, and interacts with APIs (Browser & Third-Party).
        */

        // STEP 2: Get the EM element and store as a variable, using const
        const teacherEm = document.querySelector('em');

        // STEP 3: Assign a click event listener to the above element
        // (Note: This would be commented out if you were testing STEP 5)
        teacherEm.addEventListener('click', updateName);

        // STEP 4: Create a function that waits for the above click event
        function updateName() {
            
            // STEP 4a: Display a prompt asking for input, and assign it to a variable using let
            let newName = prompt('Please enter a new name:');
            
            // STEP 4b: Build a new string and change the text inside the EM element
            if (newName) {
                teacherEm.textContent = newName;
            }
        }

        /* 
        STEP 5 & 6 Note: 
        To follow Step 6 properly, you would cut the code above (Steps 2-4) 
        and paste it into a file named 'scripts.js' inside a 'js' folder, 
        then use the <script src="..." defer> tag in the <head>.
        */
    </script>
</body>
</html>
